name: Squash History

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  squash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # needed to dispatch the Deploy site workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Squash all commits into one
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan squash-temp
          git add -A
          git commit -m "initial commit"

          git branch -D master
          git branch -m master
          git push --force origin master

      # The force-push above rewrites history to an orphan commit, so the
      # next normal push has no common ancestor with it on GitHub's side.
      # That breaks deploy.yml's paths-filtered push trigger for that one
      # push (GitHub can't diff unrelated histories), silently skipping
      # the deploy. Dispatch it explicitly here as a safety net.
      - name: Trigger site deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref master
